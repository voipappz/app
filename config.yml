version: 2.1

jobs:
  install-deps:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Clear previous node_modules and cache
          command: |
            rm -rf node_modules
            npm cache clean --force
      - run:
          name: Install dependencies
          command: |
            # First attempt with npm ci
            npm ci || true
            
            # If rollup is missing, try installing with npm install
            if [ ! -d "node_modules/@rollup" ]; then
              echo "Rollup not found, installing with npm install..."
              rm -rf node_modules
              npm install
            fi
            
            # Explicitly install rollup if still missing
            if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
              echo "Installing specific rollup binary..."
              npm install @rollup/rollup-linux-x64-gnu --save-optional
            fi
      - run:
          name: Install Cypress binary
          command: npx cypress install
      - save_cache:
          paths:
            - node_modules
            - ~/.cache/Cypress
          key: v1-node-deps-{{ checksum "package-lock.json" }}

  test-quality:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-node-deps-{{ checksum "package-lock.json" }}
      - checkout
      - run: npm run test-quality

  test-cypress:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-node-deps-{{ checksum "package-lock.json" }}
      - run: npm run test:e2e

  security-scan:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-node-deps-{{ checksum "package-lock.json" }}
      - run: npm run security-scan

  build:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-node-deps-{{ checksum "package-lock.json" }}
      - run:
          name: Verify dependencies and build
          command: |
            # Check if rollup binary exists
            if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
              echo "Rollup binary missing, reinstalling..."
              npm install @rollup/rollup-linux-x64-gnu --save-optional || true
              
              # If still missing, do full reinstall
              if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
                echo "Full reinstall of dependencies..."
                rm -rf node_modules
                npm install
              fi
            fi
            
            # Now try to build
            npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  build-docker:
    docker:
      #- image: cimg/ubuntu:22.04
      #- image: ubuntu-2204:2024.11.1
      - image: cimg/base:24.04
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            # Use Docker Hub registry format: username/repository:tag
            echo " Building Docker image"
            TAG="release-${CIRCLE_BUILD_NUM}"
            docker build -t nirlevi/va-admin:${TAG} .
            echo " Docker images created:"
            echo "- nirlevi/va-admin:${TAG}"
      #- run:
          #name: Test Docker container
          #command: |
            #echo " Testing Docker container..."
            #TAG="release-${CIRCLE_BUILD_NUM}"
            #docker run --rm -d --name va-admin-test -p 8000:8000 nirlevi/va-admin:${TAG}
            #sleep 5
            #echo "Testing HTTPS access..."
            #curl -k -f https://localhost:8000/ || exit 1
            #echo "Testing asset loading..."
            #curl -k -f https://localhost:8000/assets/index-*.js || exit 1
            #echo "Testing dashboard routing..."
            #curl -k -f https://localhost:8000/dashboard/ || exit 1
            #docker stop va-admin-test
            #echo " Docker container tests passed"
      - run:
          name: "Push Docker image"
          command: |
            TAG="release-${CIRCLE_BUILD_NUM}"
            echo "$DOCKER_PASS" | docker login --username nirlevi --password-stdin
            docker push nirlevi/va-admin:${TAG}
            echo "Successfully pushed Docker image:"
            echo "   - nirlevi/va-admin:${TAG}"


workflows:
  version: 2

  # Main CI/CD workflow - production branches only
  ci-cd:
    jobs:
      - install-deps
      - test-quality:
          requires:
            - install-deps
          filters:
            branches:
              only:
                - main
                - master
      - security-scan:
          requires:
            - test-quality
          filters:
            branches:
              only:
                - main
                - master
      #- test-cypress:
          #requires:
            #- test-quality
          #filters:
            #branches:
              #only:
                #- main
                #- master
      - build:
          requires:
            #- test-cypress
            - security-scan
          filters:
            branches:
              only:
                - main
                - master
      - build-docker:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - master

  # Feature branch workflow - lighter testing
  feature-testing:
    jobs:
      - install-deps
      - test-quality:
          requires:
            - install-deps
          filters:
            branches:
              only:
                - /^feature.*/
                - /^fix.*/
                - /^cypress.*/
                - dev-claude
      - security-scan:
          requires:
            - test-quality
          filters:
            branches:
              only:
                - /^feature.*/
                - /^fix.*/
                - /^cypress.*/
                - dev-claude
      - build:
          requires:
            - test-quality
            - security-scan
          filters:
            branches:
              only:
                - /^feature.*/
                - /^fix.*/
                - /^cypress.*/
                - dev-claude
      - build-docker:
          requires:
            - build
          filters:
            branches:
              only:
                - /^feature.*/
                - /^fix.*/
                - /^cypress.*/
                - dev-claude

