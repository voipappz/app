<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://voipappz.com/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voipappz</title>
    <!-- Set the theme and the reading direction before first paint: both
         contexts apply them in an effect, which flashed a stored dark theme
         light — and would flash a Hebrew session left-to-right — on every
         reload. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme-preference');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);

          // Unlike the theme, language does NOT follow the browser: a
          // Hebrew-locale browser must not silently get a Hebrew console.
          // English is the default until someone chooses otherwise.
          var l = localStorage.getItem('app-language');
          if (l !== 'he' && l !== 'en') l = 'en';
          document.documentElement.lang = l;
          document.documentElement.dir = (l === 'he') ? 'rtl' : 'ltr';
        } catch (e) { /* storage blocked: the app sets them on mount */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
