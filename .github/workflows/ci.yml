name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Frontend (lint + unit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  api:
    name: Deno API (check + tests + boot smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check app.ts server.ts
      - run: deno test --allow-net --allow-env --allow-read tests/
      # Boot the server with no env at all and prove the health surface is up —
      # optional deps must report "disabled", never crash the boot.
      - name: Boot smoke (/test + /health with zero config)
        run: |
          deno run --allow-net --allow-env --allow-read app.ts &
          for i in $(seq 1 20); do
            curl -sf localhost:4001/test > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf localhost:4001/test
          echo
          curl -sf localhost:4001/health
