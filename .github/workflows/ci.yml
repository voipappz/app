# The gate. Everything here also runs from `make check`, so a red CI is
# reproducible on a laptop without guessing which step differed.
#
# GitHub Actions is the admin's only CI. CircleCI, kept for a Bitbucket mirror,
# was retired on 2026-09-14; its nginx check, dependency audit, build stamping
# and Docker Hub image push live here now.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a branch cancels the run still in flight for the old commit --
  # except on main, where the run may be halfway through pushing the image.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: lint, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The login gate in front of make dev/serve/test, offline.
      - name: Login gate
        run: bin/onboard.test.sh

      # A public repo makes a leaked credential permanent. Cheaper here than
      # after a scraper finds it.
      - name: No credentials in anything git would publish
        run: bin/check-secrets.sh

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit:run

      # Stamped the way the CircleCI build was, so the running app still reports
      # which build and commit it is (dist/version.json, VITE_APP_VERSION).
      - name: Production build
        run: |
          VITE_APP_VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" \
            VITE_BUILD_ID="gh-${GITHUB_RUN_NUMBER}" npm run build
          printf '{"build":"gh-%s","timestamp":"%s","commit":"%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::8}" > dist/version.json

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Level and allowlist live in audit-ci.jsonc, with the reason for each entry.
      - name: npm audit (moderate and above)
        run: npm run security-scan

  nginx:
    name: nginx.conf syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # `nginx -t` loads the TLS pair and resolves the upstream hosts, so the test
      # image gets a throwaway self-signed cert and the upstreams map to localhost.
      - name: nginx -t
        run: |
          cat > /tmp/Dockerfile.nginx-test <<'EOF'
          FROM nginx:alpine
          RUN apk add --no-cache openssl && \
              mkdir -p /opt/va/certs && \
              openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
                -keyout /opt/va/certs/server.key -out /opt/va/certs/server.crt \
                -subj "/CN=test" 2>/dev/null
          COPY nginx.conf /etc/nginx/nginx.conf
          EOF
          docker build -f /tmp/Dockerfile.nginx-test -t nginx-test .
          docker run --rm --add-host=cable:127.0.0.1 --add-host=api:127.0.0.1 \
            nginx-test nginx -t

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    # The suite signs in to a real API, so it needs repository secrets.
    #
    # Two cases cannot have them, and both would fail for reasons nobody can fix
    # in the PR: a fork (forks never receive secrets) and Dependabot (its runs
    # get the separate `dependabot` secret scope, not this one -- which is what
    # turned all twelve of its opening PRs red). `check` is the gate those can
    # actually pass.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # Without the secrets the login fails in a way that reads like a product
      # bug. Say which ones are missing and skip the suite -- a repo that has not
      # configured e2e yet should not be red on every push.
      - name: Check test credentials
        id: creds
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VA_TEST_OTP: ${{ secrets.VA_TEST_OTP }}
        run: |
          missing=""
          # VA_TEST_OTP is optional: OTP is off by default on the API.
          for k in VITE_API_BASE_URL TEST_EMAIL TEST_PASSWORD; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::notice::end-to-end skipped: missing repository secrets:$missing (Settings -> Secrets and variables -> Actions)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "credentials present"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      - name: Install Playwright browser
        if: steps.creds.outputs.ready == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run Playwright
        if: steps.creds.outputs.ready == 'true'
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VA_TEST_OTP: ${{ secrets.VA_TEST_OTP }}
        # The required check is the login smoke: sign in to the API in the
        # secrets and load the app shell. The full suite was written against
        # the old cloud API and does not fit this job's 30 minutes against
        # switch; run it with `make test` while specs are brought over.
        run: make test SPEC=login-smoke

      - name: Upload the report
        if: always() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [check, audit, nginx]
    timeout-minutes: 20
    # Builds the image on every pull request, so a broken Dockerfile fails the
    # PR instead of the first push to main (which is how a missing .npmrc
    # reached main). Only a push to main logs in and publishes
    # nirlevi/va-admin:latest and :release-gh-<run>: a pull request would
    # overwrite :latest, and a fork never receives DOCKER_PASS. The tag is
    # release-gh-<run>, not release-<run>, because the CircleCI builds already
    # used release-1..release-12944 and GitHub's run number starts near 1.
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check Docker Hub credential
        id: hub
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          if [ "$PUBLISH" != "true" ]; then
            echo "build only: not a push to main"
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DOCKER_PASS" ]; then
            echo "::notice::Docker Hub push skipped: no DOCKER_PASS repository secret"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: steps.hub.outputs.push == 'true'
        with:
          username: nirlevi
          password: ${{ secrets.DOCKER_PASS }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.hub.outputs.push == 'true' }}
          tags: |
            nirlevi/va-admin:release-gh-${{ github.run_number }}
            nirlevi/va-admin:latest
          cache-from: ${{ steps.hub.outputs.push == 'true' && 'type=registry,ref=nirlevi/va-admin:latest' || '' }}
          cache-to: ${{ steps.hub.outputs.push == 'true' && 'type=inline' || '' }}

  # One mail per release, pass or fail, so a red main does not wait to be
  # noticed. Only on a push to main: a pull request already reports itself on
  # the PR page. Credentials are repository secrets (SES, eu-central-1); the
  # step is skipped rather than failed when they are absent, so a fork or a
  # checkout without secrets still gets a green run.
  notify:
    name: release email
    runs-on: ubuntu-latest
    needs: [check, audit, nginx, e2e, docker]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check SMTP credentials
        id: smtp
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "::notice::Release email skipped: no SMTP_PASSWORD repository secret"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send the release email
        if: steps.smtp.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.SMTP_ADDRESS }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: VoipAppz CI <${{ secrets.SMTP_FROM }}>
          to: ${{ secrets.SMTP_TO }}
          subject: >-
            admin ${{ (needs.check.result == 'success' && needs.audit.result == 'success'
            && needs.nginx.result == 'success' && needs.docker.result == 'success')
            && 'released' || 'FAILED' }}: gh-${{ github.run_number }}
          body: |
            ${{ github.repository }} on main — ${{ github.sha }}

            lint, unit, build : ${{ needs.check.result }}
            dependency audit  : ${{ needs.audit.result }}
            nginx.conf syntax : ${{ needs.nginx.result }}
            end-to-end        : ${{ needs.e2e.result }}
            Docker image      : ${{ needs.docker.result }}

            ${{ needs.docker.result == 'success'
            && format('Published nirlevi/va-admin:release-gh-{0} and :latest', github.run_number)
            || 'No image published.' }}

            ${{ github.event.head_commit.message }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
