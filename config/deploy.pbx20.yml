# Kamal DESTINATION override for pbx20 — NON-DISRUPTIVE test deploy.
#
# pbx20 (freeswitch-20) runs the live VoIP stack with KONG on 80/443. So we do
# NOT run kamal-proxy (proxy: false) and publish ONLY on 127.0.0.1:8888 — the
# host's 80/443 (Kong) are never touched. itdroot is in the docker group, so no
# root is needed. The browser logs in against the MTN API directly
# (VITE_MOTHERSHIP_URL baked below); deno just serves the bundle.
#
#     kamal config -d pbx20     # render + verify (read-only)
#     kamal deploy -d pbx20
#     kamal app logs -d pbx20

servers:
  web:
    hosts:
      - pbx20.itd-pbx.com
    # Do NOT run kamal-proxy for this role — Kong owns 80/443. Role-level
    # `proxy: false` runs the container directly, published on 8888 below.
    proxy: false
    # Replace the prod env-file (which lives on appcc3, not here) with a local
    # one (created on the host first), and publish 8888→3000.
    options:
      env-file: /home/itdroot/voipappz-app.env
      publish:
        - "127.0.0.1:8888:3000"

ssh:
  user: itdroot
  port: 22
  keys:
    - "~/.ssh/kamal_deploy"

builder:
  arch: amd64
  args:
    VITE_MOTHERSHIP_URL: https://mtnunicom.mtn.com.gh
