# Kamal DESTINATION override for pbx20 — NON-DISRUPTIVE test deploy.
#
# pbx20 (freeswitch-20) runs the live VoIP stack with KONG on 80/443. So we do
# NOT run kamal-proxy (proxy: false) and publish ONLY on 127.0.0.1:8888 — the
# host's 80/443 (Kong) are never touched. itdroot is in the docker group, so no
# root is needed. The browser talks only to THIS container; deno forwards to the
# MTN API from MOTHERSHIP_URL below. It used to reach the MTN API straight from
# the browser via a baked VITE_MOTHERSHIP_URL, which cannot work: a request from
# this host to mtnunicom.mtn.com.gh is cross-origin and CORS blocks it.
#
#     kamal config -d pbx20     # render + verify (read-only)
#     kamal deploy -d pbx20
#     kamal app logs -d pbx20

servers:
  web:
    hosts:
      - pbx20.itd-pbx.com
    # Do NOT run kamal-proxy for this role — Kong owns 80/443. Role-level
    # `proxy: false` runs the container directly, published on 8888 below.
    proxy: false
    # Replace the prod env-file (which lives on appcc3, not here) with a local
    # one (created on the host first), and publish 8888→3000.
    options:
      env-file: /home/itdroot/voipappz-app.env
      publish:
        - "127.0.0.1:8888:3000"

ssh:
  user: itdroot
  port: 22
  keys:
    - "~/.ssh/kamal_deploy"

env:
  clear:
    # Deno forwards /api|/auth|/tasks here, server-side, where the browser's
    # origin rules do not apply.
    MOTHERSHIP_URL: https://mtnunicom.mtn.com.gh

builder:
  arch: amd64
  # No VITE_MOTHERSHIP_URL: baking it puts the BROWSER on a cross-origin call to
  # another host, which CORS blocks. Same tenant, same API — reached through the
  # forwarder instead.
