# Kamal DESTINATION override for nimbus — nimbus-prod.voipappz.io (194.36.89.216).
#
# The API and this app share the box: nimbus-prod.voipappz.io resolves to
# 194.36.89.216, and Kong already owns 80/443 there (its default cert,
# X-RateLimit-* headers). So we do NOT run kamal-proxy — the container publishes
# on 8888 and is reached directly, per instruction. Kong is left untouched.
#
# TLS terminates IN THIS CONTAINER on 8888, using the host's own certificate
# mounted read-only — so the app is https://nimbus-prod.voipappz.io:8888/ and
# nothing of Kong's is borrowed or touched.
#
#     kamal config -d nimbus     # render + verify (read-only)
#     kamal deploy -d nimbus

servers:
  web:
    hosts:
      - 194.36.89.216
    # Kong owns 80/443 — role-level `proxy: false` runs the container directly.
    proxy: false
    options:
      # Runtime secrets. This file must EXIST ON THE HOST before the first
      # deploy: Kamal mounts it, it does not create it, and a missing --env-file
      # stops the container from starting at all.
      env-file: /etc/voipappz/secrets.env
      # Run as root so deno can read the host key: /opt/va/certs/server.key is
      # root-owned there, and the image's `deno` user could not read it.
      # Container-root is namespaced, and the cert mount is read-only.
      user: "0:0"
      publish:
        - "0.0.0.0:8888:3000"   # https://nimbus-prod.voipappz.io:8888/

# The live TLS certificate (read-only) plus the persistent Dashboard event store.
#
# BOTH cert mounts are required. /opt/va/certs/server.{crt,key} are Let's
# Encrypt symlinks pointing OUTSIDE that directory:
#     server.crt -> ../../archive/nimbus-prod.voipappz.io/fullchain1.pem
# Mounting only /opt/va/certs leaves them dangling in the container and deno
# gives up with "Too many levels of symbolic links (os error 40)" — then falls
# back to plain HTTP, so the site answers but https does not.
#
# The link is RELATIVE, so from /certs it resolves to /archive/... — mounting
# /opt/archive there makes it resolve. Following the symlink rather than naming
# fullchain1.pem directly is deliberate: certbot renewals write fullchain2.pem
# and repoint the link, which a hardcoded filename would not survive.
volumes:
  - "/opt/va/certs:/certs:ro"
  - "/opt/archive:/archive:ro"
  - "voipappz-events:/data"

env:
  clear:
    # deno serves HTTPS when both point at readable PEM files, and falls back to
    # plain HTTP with a warning if they are not — so a bad mount downgrades
    # silently rather than failing loudly. Worth checking the logs on first boot.
    TLS_CERT_FILE: /certs/server.crt
    TLS_KEY_FILE: /certs/server.key
    # Where DENO forwards /api|/auth|/tasks — server-side, so the browser's
    # origin rules never apply. Stated explicitly and never inherited: the
    # forwarder's default is cloud.voipappz.io, and inheriting it would quietly
    # authenticate this tenant's users against the wrong mothership.
    MOTHERSHIP_URL: https://nimbus-prod.voipappz.io
    # va-crystal's ActionCable endpoint is independent of the HTTPS API. A
    # matching CABLE_TOKEN/SECRET_KEY remains in the host-only secrets.env.
    CABLE_URL: ws://nimbus-prod.voipappz.io:4000/cable

ssh:
  # Verified against the host: this key/user pair is the one authorised there
  # (kamal_deploy is not, under any user — it falls back to a password prompt
  # the containerised kamal has no tty to answer).
  user: root
  port: 22
  keys:
    - "~/.ssh/connectix_deploy_new"

builder:
  arch: amd64
  args:
    # Nimbus currently has no usable browser SIP/WebRTC endpoint. Cable remains
    # enabled server-side and is unaffected by this frontend-only switch.
    VITE_SIP_ENABLED: "false"
  # NO VITE_MOTHERSHIP_URL, deliberately.
  #
  # Baking it puts the BROWSER on an absolute URL. The app is served from
  # :8888 and the API answers on :443 — a different port is a different origin,
  # so every call would be blocked by CORS. That is exactly what happened on
  # MTN. Unset, the bundle uses RELATIVE urls, they stay on :8888, and deno
  # forwards them from MOTHERSHIP_URL above.
