# Kamal DESTINATION override for MTN — mtnunicom.mtn.com.gh (81.199.146.152).
#
# Same non-disruptive posture as pbx20: the MTN box is a live production host
# running nginx on 80/443 + the voipappz-api on :8000, so we do NOT run
# kamal-proxy (proxy: false) and publish ONLY on 127.0.0.1:8888. The existing
# nginx reverse-proxies to :8888; TLS stays with nginx. The frontend logs in
# against the MTN API on the same box.
#
#     kamal config -d mtn      # render + verify (read-only)
#     kamal deploy -d mtn

servers:
  web:
    hosts:
      - 81.199.146.152
    # The portal (va_portal_1 nginx) owns 80/443 here — role-level proxy:false
    # runs our container directly on 8888. We terminate TLS ourselves on 8888
    # using the host's OWN cert, mounted read-only. Nothing on 80/443/the portal
    # is touched.
    proxy: false
    options:
      env-file: /home/voipappz/voipappz-app.env
      # Run as root so deno can read the 0600 host key (owned by voipappz uid
      # 1000; our container's deno user is uid 1993). Container-root is namespaced
      # — no host access, and the cert mount is read-only.
      user: "0:0"
      publish:
        - "0.0.0.0:8888:3000"   # https://mtnunicom.mtn.com.gh:8888/

# Destination overrides the base volume list, so retain both the live TLS
# certificate mount and the persistent Dashboard event store.
volumes:
  - "/opt/va/certs:/certs:ro"
  - "voipappz-events:/data"

env:
  clear:
    TLS_CERT_FILE: /certs/mtn.crt
    TLS_KEY_FILE: /certs/mtn.key
    # Where DENO forwards /api|/auth|/tasks. Server-side, so it is not subject
    # to the browser's origin rules — and it must be stated, or the forwarder
    # falls back to its cloud.voipappz.io default and MTN users would log in
    # against the wrong tenant.
    MOTHERSHIP_URL: https://mtnunicom.mtn.com.gh

ssh:
  user: voipappz
  port: 22
  keys:
    - "~/.ssh/kamal_deploy"

builder:
  arch: amd64
  # NO VITE_MOTHERSHIP_URL here, deliberately.
  #
  # It used to be set to https://mtnunicom.mtn.com.gh with a comment claiming
  # "same-origin". It is not: this container publishes on :8888, that URL is
  # :443, and a different port is a different origin. Every call the browser
  # made to the mothership was therefore cross-origin and blocked:
  #
  #   Access to fetch at 'https://mtnunicom.mtn.com.gh/api/calls'
  #   from origin 'https://mtnunicom.mtn.com.gh:8888' has been blocked by CORS
  #
  # which took out Calls, call history and calls-per-hour together. Unset, the
  # bundle uses RELATIVE urls, they stay on :8888, and deno forwards them from
  # MOTHERSHIP_URL above — the arrangement the app is designed around.
