# The no-Node-on-the-host path: everything runs in a container, the repo is
# bind-mounted, and you edit files normally. Same model as voipappz-api, where
# the host needs no Ruby.
#
# Drive it through the Makefile rather than by hand:
#   make dev DOCKER=1        dev server on :3000, hot reload
#   make setup DOCKER=1      dependencies, into the named volume
#   docker compose run --rm build   production bundle into ./dist
#   make test DOCKER=1       the Playwright suite
#
# `version:` is deliberately absent -- compose v2 ignores it and warns.

services:
  # React + Vite dev server. Publishes the SAME port as the host path, so
  # http://localhost:3000 is the address either way and no one has to remember
  # which mode they started.
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file: [.env]
    environment:
      NODE_ENV: development
      VITE_DEV_PORT: "${PORT:-3000}"
      # HMR's WebSocket is dialled by the BROWSER, so it needs the host port,
      # not the container's view of it.
      VITE_HMR_CLIENT_PORT: "${PORT:-3000}"
      VITE_HMR_HOST: localhost
      # inotify does not cross a bind mount on macOS or Windows; without
      # polling an edit never triggers a reload and the container looks hung.
      VITE_USE_POLLING: "true"
    volumes:
      - .:/app
      # A named volume, so the container's node_modules (linux binaries) never
      # overwrite a host install built for a different platform.
      - node_modules:/app/node_modules

  # One-shot production build. Output lands in ./dist on the host.
  build:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build"
    env_file: [.env]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    profiles: [tools]      # never starts with `up`

  # Playwright, in Microsoft's image so the browsers are already present.
  test:
    image: mcr.microsoft.com/playwright:v1.57.0-jammy
    working_dir: /app
    command: sh -c "npm install && npx wait-on http://app:${PORT:-3000} --timeout 120000 && npx playwright test --project=chromium --reporter=line"
    env_file: [.env]
    environment:
      # Inside the network the app answers on its service name, not localhost.
      PLAYWRIGHT_BASE_URL: "http://app:${PORT:-3000}"
    volumes:
      - .:/app
      - node_modules_test:/app/node_modules
    depends_on: [app]
    profiles: [tools]

volumes:
  node_modules:
  node_modules_test:
