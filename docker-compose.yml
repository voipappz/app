# Core services (react-app + deno-api) have NO profile, so a plain
#   docker compose up -d        (or: make up)
# starts ONLY them. Everything else is behind a profile and is never built or
# started by a default `up`/`build` — so a heavy/optional build (e.g. the
# `production` image) failing can never break the core dev stack. Opt in with:
#   docker compose --profile tools up -d claude
#   docker compose --profile test  run --rm deno-tests
#   docker compose --profile prod  build production
services:
  # Claude AI CLI (dev shell). Opt-in: --profile tools
  claude:
    profiles: ["tools"]
    build: .
    env_file:
      - path: .env
        required: false   # template: `make up` works before .env exists
      - path: .mcp.env
        required: false   # generated by make dev/up; token stays out of Vite
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      NODE_ENV: development
      TERM: xterm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}  # each dev sets their own key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - "seccomp=unconfined"
    command: sleep infinity

  # React + Vite development server (CORE — always started by `up`)
  react-app:
    security_opt:
      - "seccomp=unconfined"
    image: node:24.10.0
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    ports:
      - "4200:4200"
    env_file:
      - path: .env
        required: false   # template: `make up` works before .env exists
    environment:
      NODE_ENV: development
      TERM: xterm
      # The app talks to the mothership (MOTHERSHIP_URL, from .env) for /api/*.
      # deno-api runs network_mode: host (:4001 on the host); this container is on
      # the bridge, so the Vite proxy reaches it via the host gateway (extra_hosts).
      VITE_DENO_API_TARGET: ${VITE_DENO_API_TARGET:-http://host.docker.internal:4001}
      # Offline mock login passthrough (see CLAUDE.md) — lets `make test` run
      # the E2E suite against the dev stack: VITE_MOCK_LOGIN=1 make up
      VITE_MOCK_LOGIN: ${VITE_MOCK_LOGIN:-}
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    command: >
      bash -c "
        echo 'Installing dependencies...' &&
        npm install &&
        echo 'Starting Vite development server...' &&
        npm run dev -- --host 0.0.0.0 --port 4200
      "

  # Production build test. Opt-in: --profile test
  test-build:
    profiles: ["test"]
    image: node:lts
    user: "node"
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/home/node/.gitconfig:ro
      - ~/.ssh:/home/node/.ssh:ro
    environment:
      NODE_ENV: production
      TERM: xterm
    command: >
      bash -c "
        echo '🔧 Testing production build...' &&
        npm install &&
        echo '🚀 Building production bundle...' &&
        npm run build &&
        echo '✅ Build completed successfully!' &&
        ls -la dist/
      "

  # Deno API server (CORE — thin BFF: auth proxy, cable→/ws relay, engine reads).
  deno-api:
    image: denoland/deno:latest
    security_opt:
      - "seccomp=unconfined"
    # Managed lifecycle (Kamal-parity) — survive crashes/reboots instead of an
    # ad-hoc `deno run`. Prod uses the same process via the Kamal `web` role.
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./api:/app
      - event_store_data:/data
    # Host networking so localhost:4000 reaches the va-crystal node's Cable
    # endpoint. Also publishes :4001.
    network_mode: host
    env_file:
      - path: .env
        required: false   # template: `make up` works before .env exists
      - path: .mcp.env
        required: false   # generated local MCP bearer token; never loaded by Vite
    environment:
      PORT: 4001
      # Live cable subscription consumes call events from the va-crystal cable
      # server's CallEvents channel (ActionCable WS) and relays them to browser
      # /ws subscribers and persists them for Dashboard-only local queries. On as soon as SECRET_KEY
      # (= cable's SECRET_KEY) is set — deno mints the HS256 JWT itself; or pass
      # a ready-made CABLE_TOKEN.
      SECRET_KEY: ${SECRET_KEY:-}
      CABLE_URL: ${CABLE_URL:-ws://127.0.0.1:4000/cable}
      CABLE_TOKEN: ${CABLE_TOKEN:-}
      # Engine (voipappz-api, "the brain") — transcripts are read on request from
      # its event store. Server-side basic-auth creds, NEVER VITE_-prefixed.
      # MOTHERSHIP_URL is the one tenant knob; ENGINE_URL overrides it when the
      # engine lives elsewhere. Must be resolved here — this `environment:` entry
      # would otherwise shadow whatever .env sets via env_file.
      ENGINE_URL: ${ENGINE_URL:-${MOTHERSHIP_URL:-https://cloud.voipappz.io}}
      ACCOUNT_EMAIL: ${ACCOUNT_EMAIL:-}
      ACCOUNT_PASSWORD: ${ACCOUNT_PASSWORD:-}
      # Event-freshness alarm: seconds the cable can be silent before /health
      # reports the stream `stale` (degraded, not 503). 0 disables. Default 15min.
      EVENTS_STALE_SECONDS: ${EVENTS_STALE_SECONDS:-900}
      EVENT_STORE_PATH: /data/events.duckdb
      # Development-only read surface used by the in-app Raw events page.
      # Production remains off unless an operator explicitly enables it.
      EVENT_INSPECTOR_ENABLED: ${EVENT_INSPECTOR_ENABLED:-1}
      # Developer-agent access to the same DuckDB rows. Development enables it
      # for loopback clients; a token is still required beyond localhost.
      MCP_ENABLED: ${MCP_ENABLED:-1}
      MCP_ALLOW_LOCALHOST_WITHOUT_TOKEN: ${MCP_ALLOW_LOCALHOST_WITHOUT_TOKEN:-1}
      # Current-system CDR tap. cdr.write.bulk is the same batch the Ruby API
      # consumes to insert EventCdr. Selecting events.cdr enables replay.
      NATS_URL: ${NATS_URL:-}
      NATS_CDR_SUBJECTS: ${NATS_CDR_SUBJECTS:-cdr.write.bulk}
      NATS_RECONCILE_SECONDS: ${NATS_RECONCILE_SECONDS:-30}
      # Optional connector; the current Dashboard does not require it.
      INFLUXDB_URL: ${INFLUXDB_URL:-}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-telegraf}
    command: deno run --allow-net --allow-env --allow-read --allow-write --allow-ffi --watch app.ts

  # Playwright E2E (browsers preinstalled). Opt-in: --profile test
  # Drives the app on the host network (make up / make dev must be running,
  # or point PLAYWRIGHT_BASE_URL at any deployed origin).
  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    network_mode: host
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
    environment:
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://localhost:4200}
    command: >
      bash -c "
        npm install --loglevel=error --no-audit --no-fund &&
        npx playwright test
      "

  # Deno API tests. Opt-in: --profile test
  deno-tests:
    profiles: ["test"]
    image: denoland/deno:latest
    working_dir: /app
    volumes:
      - ./api:/app
    env_file:
      - path: .env
        required: false   # template: `make up` works before .env exists
    command: deno test --allow-net --allow-env --allow-read --allow-write --allow-ffi tests/

  # Production image (build + run). Opt-in: --profile prod
  # Heavy build (Deno + Vite). Behind a profile so a build failure can never
  # break the core dev stack — it is only built/run when you ask for it.
  production:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.production
    # The image serves everything on PORT (deno: dist/ + API) — same process
    # Kamal runs in prod (config/deploy.yml, app_port 3000).
    ports:
      - "8000:3000"
    environment:
      PORT: 3000
      EVENT_STORE_PATH: /data/events.duckdb
      NATS_URL: ${NATS_URL:-}
      NATS_CDR_SUBJECTS: ${NATS_CDR_SUBJECTS:-cdr.write.bulk}
      NATS_RECONCILE_SECONDS: ${NATS_RECONCILE_SECONDS:-30}
    volumes:
      - event_store_data:/data
    # No container healthcheck: the image has no curl (in prod, kamal-proxy
    # probes /test externally — config/deploy.yml). Verify locally with:
    #   curl localhost:8000/test

volumes:
  node_modules_cache:
  event_store_data:
