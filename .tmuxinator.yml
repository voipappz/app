# Dev cockpit — one command opens the whole stack with logs + shells:
#   make tmux          (or: tmuxinator local)
# Requires tmux + tmuxinator on the host. Uses the Docker stack (make up);
# for host-Vite HMR use `make dev` in a plain terminal instead.
name: voipappz
root: <%= ENV["PWD"] %>

# Start the core stack (react-app + deno-api) before any window opens.
pre_window: docker compose up -d

windows:
  - app:
      layout: main-vertical
      panes:
        - vite:
            - docker compose logs -f react-app
        - deno:
            - docker compose logs -f deno-api

  - shell:
      layout: even-horizontal
      panes:
        - repo:
            - echo "repo shell — try: make verify | make test | npm run test:run"
        - container:
            - docker compose exec react-app bash

  - status:
      layout: even-horizontal
      panes:
        - verify:
            - make verify
            - echo ""
            - echo "make verify  — re-run the health check"
        - monitor:
            - watch -n 5 docker compose ps
